services:
  postgres:
    image: postgres:17-alpine
    container_name: jobpilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-jobpilot}
      POSTGRES_USER: ${DB_USERNAME:-jobpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobpilot} -d ${DB_NAME:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
