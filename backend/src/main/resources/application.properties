spring.application.name=jobpilot-backend

# Database (override via environment variables; defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobpilot}
spring.datasource.username=${DB_USERNAME:jobpilot}
spring.datasource.password=${DB_PASSWORD:jobpilot}

# Schema is managed exclusively by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
